name: certbot
description: Certbot SSL certificate tool installation
versions:
  - version: "v1"
    tag: certonly
    latest: false
    description: Certbot standalone installation
    commands:
      - description: Install Certbot
        platforms:
          ubuntu: apt-get update && apt-get install -y certbot
          debian: apt-get update && apt-get install -y certbot
          centos: yum install -y epel-release && yum install -y certbot
          rhel: yum install -y epel-release && yum install -y certbot
          fedora: dnf install -y certbot
          arch: pacman -S --noconfirm certbot
          darwin: brew install certbot
          windows: powershell -Command "pip install certbot"
        command: apt-get update && apt-get install -y certbot
        skip_on_error: false
      - description: Verify Certbot installation
        command: certbot --version
        skip_on_error: false
  - version: "v2"
    tag: nginx
    latest: true
    description: Certbot with Nginx plugin installation
    commands:
      - description: Install Certbot with Nginx plugin
        platforms:
          ubuntu: apt-get update && apt-get install -y certbot python3-certbot-nginx
          debian: apt-get update && apt-get install -y certbot python3-certbot-nginx
          centos: yum install -y epel-release && yum install -y certbot python3-certbot-nginx
          rhel: yum install -y epel-release && yum install -y certbot python3-certbot-nginx
          fedora: dnf install -y certbot python3-certbot-nginx
          arch: pacman -S --noconfirm certbot certbot-nginx
          darwin: brew install certbot
          windows: powershell -Command "pip install certbot certbot-nginx"
        command: apt-get update && apt-get install -y certbot python3-certbot-nginx
        skip_on_error: false
      - description: Verify Certbot installation
        command: certbot --version
        skip_on_error: false
      - description: List installed plugins
        command: certbot plugins
        skip_on_error: true

