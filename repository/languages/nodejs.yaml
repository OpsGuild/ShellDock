name: nodejs
description: Node.js installation and setup
versions:
  - version: "v1"
    latest: true
    description: Node.js installation using NodeSource repository
    commands:
      - description: Install Node.js
        platforms:
          ubuntu: curl -fsSL https://deb.nodesource.com/setup_lts.x | bash - && apt-get install -y nodejs
          debian: curl -fsSL https://deb.nodesource.com/setup_lts.x | bash - && apt-get install -y nodejs
          centos: curl -fsSL https://rpm.nodesource.com/setup_lts.x | bash - && yum install -y nodejs
          rhel: curl -fsSL https://rpm.nodesource.com/setup_lts.x | bash - && yum install -y nodejs
          fedora: curl -fsSL https://rpm.nodesource.com/setup_lts.x | bash - && dnf install -y nodejs
          arch: pacman -S nodejs npm
          darwin: brew install node
          windows: 'winget install -e --id OpenJS.NodeJS.LTS --accept-source-agreements --accept-package-agreements'
        command: curl -fsSL https://deb.nodesource.com/setup_lts.x | bash - && apt-get install -y nodejs
      - description: Verify Node.js installation
        command: node --version && npm --version
        skip_on_error: false
      - description: Install global npm packages (optional)
        platforms:
          linux: npm install -g {{packages}}
          darwin: npm install -g {{packages}}
          windows: 'npm install -g {{packages}}'
        command: npm install -g {{packages}}
        skip_on_error: true
        args:
          - name: packages
            prompt: "Enter npm package names to install globally (space-separated, e.g., yarn pnpm)"
            default: "yarn pnpm"
            required: false
