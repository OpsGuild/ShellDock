name: ufw
description: UFW (Uncomplicated Firewall) installation and setup
versions:
  - version: "v1"
    latest: true
    description: UFW installation and basic configuration
    commands:
      - description: Install UFW
        platforms:
          ubuntu: apt-get update && apt-get install -y ufw
          debian: apt-get update && apt-get install -y ufw
          centos: yum install -y epel-release && yum install -y ufw
          rhel: yum install -y epel-release && yum install -y ufw
          fedora: dnf install -y ufw
          arch: pacman -S --noconfirm ufw
          darwin: brew install ufw
        command: apt-get update && apt-get install -y ufw
        skip_on_error: false
      - description: Set default policies (deny incoming, allow outgoing)
        command: ufw default deny incoming && ufw default allow outgoing
        skip_on_error: false
      - description: Allow SSH connections (port 22)
        command: ufw allow ssh
        skip_on_error: false
      - description: Enable UFW
        command: ufw --force enable
        skip_on_error: false
      - description: Verify UFW status
        command: ufw status verbose
        skip_on_error: false

