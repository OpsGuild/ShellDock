name: openssh
description: OpenSSH server installation and configuration
versions:
  - version: "v1"
    tag: install
    latest: true
    description: Install OpenSSH server and client, enable service, configure firewall
    commands:
      - description: Install OpenSSH server
        platforms:
          ubuntu: apt-get update && apt-get install -y openssh-server
          debian: apt-get update && apt-get install -y openssh-server
          centos: yum install -y openssh-server
          rhel: yum install -y openssh-server
          fedora: dnf install -y openssh-server
          arch: pacman -S --noconfirm openssh
          darwin: echo "OpenSSH is pre-installed on macOS"
          windows: 'Add-WindowsCapability -Online -Name OpenSSH.Server~~~~0.0.1.0'
        command: apt-get update && apt-get install -y openssh-server
        skip_on_error: false
      - description: Install OpenSSH client (if not present)
        platforms:
          ubuntu: apt-get install -y openssh-client
          debian: apt-get install -y openssh-client
          centos: yum install -y openssh-clients
          rhel: yum install -y openssh-clients
          fedora: dnf install -y openssh-clients
          arch: pacman -S --noconfirm openssh
          darwin: echo "OpenSSH client is pre-installed on macOS"
          windows: 'Add-WindowsCapability -Online -Name OpenSSH.Client~~~~0.0.1.0'
        command: apt-get install -y openssh-client
        skip_on_error: true
      - description: Wait for SSH service to be ready
        platforms:
          linux: sleep 3
          darwin: sleep 3
          windows: 'Start-Sleep -Seconds 3'
        command: sleep 3
        skip_on_error: true
      - description: Enable and start SSH service
        platforms:
          ubuntu: systemctl enable ssh && systemctl start ssh
          debian: systemctl enable ssh && systemctl start ssh
          centos: systemctl enable sshd && systemctl start sshd
          rhel: systemctl enable sshd && systemctl start sshd
          fedora: systemctl enable sshd && systemctl start sshd
          arch: systemctl enable sshd && systemctl start sshd
          darwin: systemsetup -setremotelogin on
          windows: 'Set-Service -Name sshd -StartupType Automatic; Start-Service sshd'
        command: systemctl enable ssh && systemctl start ssh
        skip_on_error: false
      - description: Configure SSH firewall rule (allow port 22)
        platforms:
          ubuntu: ufw allow ssh 2>/dev/null || true
          debian: ufw allow ssh 2>/dev/null || true
          centos: firewall-cmd --permanent --add-service=ssh && firewall-cmd --reload 2>/dev/null || true
          rhel: firewall-cmd --permanent --add-service=ssh && firewall-cmd --reload 2>/dev/null || true
          fedora: firewall-cmd --permanent --add-service=ssh && firewall-cmd --reload 2>/dev/null || true
          arch: ufw allow ssh 2>/dev/null || true
          windows: 'New-NetFirewallRule -Name "OpenSSH-Server-In-TCP" -DisplayName "OpenSSH Server (sshd)" -Enabled True -Direction Inbound -Protocol TCP -Action Allow -LocalPort 22 -ErrorAction SilentlyContinue'
        command: ufw allow ssh 2>/dev/null || true
        skip_on_error: true
      - description: Allow ICMP ping (allow external connectivity checks)
        platforms:
          ubuntu: ufw allow proto icmp 2>/dev/null || iptables -A INPUT -p icmp --icmp-type echo-request -j ACCEPT 2>/dev/null || true
          debian: ufw allow proto icmp 2>/dev/null || iptables -A INPUT -p icmp --icmp-type echo-request -j ACCEPT 2>/dev/null || true
          centos: firewall-cmd --permanent --add-icmp-block-inversion 2>/dev/null; firewall-cmd --permanent --add-icmp-block=echo-reply 2>/dev/null || iptables -A INPUT -p icmp --icmp-type echo-request -j ACCEPT 2>/dev/null || true; firewall-cmd --reload 2>/dev/null || true
          rhel: firewall-cmd --permanent --add-icmp-block-inversion 2>/dev/null; firewall-cmd --permanent --add-icmp-block=echo-reply 2>/dev/null || iptables -A INPUT -p icmp --icmp-type echo-request -j ACCEPT 2>/dev/null || true; firewall-cmd --reload 2>/dev/null || true
          fedora: firewall-cmd --permanent --add-icmp-block-inversion 2>/dev/null; firewall-cmd --permanent --add-icmp-block=echo-reply 2>/dev/null || iptables -A INPUT -p icmp --icmp-type echo-request -j ACCEPT 2>/dev/null || true; firewall-cmd --reload 2>/dev/null || true
          arch: iptables -A INPUT -p icmp --icmp-type echo-request -j ACCEPT 2>/dev/null || true
          darwin: echo "ICMP ping is allowed by default on macOS"
          windows: 'New-NetFirewallRule -DisplayName "Allow ICMPv4-In" -Protocol ICMPv4 -IcmpType 8 -Direction Inbound -Action Allow -ErrorAction SilentlyContinue; New-NetFirewallRule -DisplayName "Allow ICMPv6-In" -Protocol ICMPv6 -IcmpType 8 -Direction Inbound -Action Allow -ErrorAction SilentlyContinue'
        command: ufw allow proto icmp 2>/dev/null || iptables -A INPUT -p icmp --icmp-type echo-request -j ACCEPT 2>/dev/null || true
        skip_on_error: true
      - description: Verify SSH service status
        platforms:
          ubuntu: systemctl status ssh --no-pager
          debian: systemctl status ssh --no-pager
          centos: systemctl status sshd --no-pager
          rhel: systemctl status sshd --no-pager
          fedora: systemctl status sshd --no-pager
          arch: systemctl status sshd --no-pager
          darwin: systemsetup -getremotelogin
          windows: 'Get-Service sshd | Select-Object Name, Status, StartType'
        command: systemctl status ssh --no-pager
        skip_on_error: false
      - description: Display SSH connection information
        platforms:
          linux: 'echo "" && echo "========================================" && echo "  SSH Server is ready!" && echo "========================================" && echo "" && CURRENT_USER=$(whoami) && HOSTNAME=$(hostname) && IP_ADDR=$(hostname -I 2>/dev/null | awk "{print \$1}" || ip route get 1 2>/dev/null | awk "{print \$7; exit}") && echo "  Hostname : $HOSTNAME" && echo "  IP       : $IP_ADDR" && echo "" && echo "  To connect, run:" && echo "    ssh $CURRENT_USER@$HOSTNAME" && echo "    ssh $CURRENT_USER@$IP_ADDR" && echo "" && echo "========================================"'
          darwin: 'echo "" && echo "========================================" && echo "  SSH Server is ready!" && echo "========================================" && echo "" && CURRENT_USER=$(whoami) && HOSTNAME=$(hostname) && IP_ADDR=$(ipconfig getifaddr en0 2>/dev/null || echo "N/A") && echo "  Hostname : $HOSTNAME" && echo "  IP       : $IP_ADDR" && echo "" && echo "  To connect, run:" && echo "    ssh $CURRENT_USER@$HOSTNAME" && echo "    ssh $CURRENT_USER@$IP_ADDR" && echo "" && echo "========================================"'
          windows: '$u = $env:USERNAME; $h = hostname; $ip = (Get-NetIPAddress -AddressFamily IPv4 | Where-Object { $_.InterfaceAlias -notlike "*Loopback*" -and $_.IPAddress -ne "127.0.0.1" } | Select-Object -First 1).IPAddress; Write-Host ""; Write-Host "========================================"; Write-Host "  SSH Server is ready!"; Write-Host "========================================"; Write-Host ""; Write-Host "  Hostname : $h"; Write-Host "  IP       : $ip"; Write-Host ""; Write-Host "  To connect, run:"; Write-Host "    ssh $u@$h"; Write-Host "    ssh $u@$ip"; Write-Host ""; Write-Host "========================================"'
        command: 'echo "" && echo "========================================" && echo "  SSH Server is ready!" && echo "========================================" && echo "" && CURRENT_USER=$(whoami) && HOSTNAME=$(hostname) && IP_ADDR=$(hostname -I 2>/dev/null | awk "{print \$1}" || ip route get 1 2>/dev/null | awk "{print \$7; exit}") && echo "  Hostname : $HOSTNAME" && echo "  IP       : $IP_ADDR" && echo "" && echo "  To connect, run:" && echo "    ssh $CURRENT_USER@$HOSTNAME" && echo "    ssh $CURRENT_USER@$IP_ADDR" && echo "" && echo "========================================"'
        skip_on_error: true

  - version: "v3"
    tag: authorize
    latest: false
    description: Authorize a public key for incoming SSH connections (run on the server)
    commands:
      - description: Create authorized_keys file with correct permissions
        platforms:
          linux: mkdir -p ~/.ssh && chmod 700 ~/.ssh && touch ~/.ssh/authorized_keys && chmod 600 ~/.ssh/authorized_keys && echo "authorized_keys file ready"
          darwin: mkdir -p ~/.ssh && chmod 700 ~/.ssh && touch ~/.ssh/authorized_keys && chmod 600 ~/.ssh/authorized_keys && echo "authorized_keys file ready"
          windows: 'New-Item -ItemType Directory -Force -Path $env:USERPROFILE\.ssh | Out-Null; New-Item -ItemType File -Force -Path $env:USERPROFILE\.ssh\authorized_keys -ErrorAction SilentlyContinue | Out-Null; Write-Host "authorized_keys file ready"'
        command: mkdir -p ~/.ssh && chmod 700 ~/.ssh && touch ~/.ssh/authorized_keys && chmod 600 ~/.ssh/authorized_keys && echo "authorized_keys file ready"
        skip_on_error: false
      - description: Add public key to authorized_keys
        platforms:
          linux: echo "{{public_key}}" >> ~/.ssh/authorized_keys && echo "Public key added to authorized_keys"
          darwin: echo "{{public_key}}" >> ~/.ssh/authorized_keys && echo "Public key added to authorized_keys"
          windows: 'Add-Content -Path $env:USERPROFILE\.ssh\authorized_keys -Value "{{public_key}}"; Write-Host "Public key added to authorized_keys"'
        command: echo "{{public_key}}" >> ~/.ssh/authorized_keys && echo "Public key added to authorized_keys"
        skip_on_error: false
        args:
          - name: public_key
            prompt: "Paste the full public key (e.g., ssh-ed25519 AAAA... user@host)"
            required: true
      - description: Copy key to administrators authorized_keys (Windows admin users)
        platforms:
          linux: echo "Skipped - not needed on Linux"
          darwin: echo "Skipped - not needed on macOS"
          windows: 'cmd /c "icacls C:\ProgramData\ssh\administrators_authorized_keys /grant:r Administrators:(F) 2>nul & copy /Y %USERPROFILE%\.ssh\authorized_keys C:\ProgramData\ssh\administrators_authorized_keys"'
        command: echo "Skipped - not needed on Linux"
        skip_on_error: true
      - description: Set correct permissions on authorized_keys
        platforms:
          linux: chmod 600 ~/.ssh/authorized_keys && chown $(whoami) ~/.ssh/authorized_keys && echo "Permissions set on authorized_keys"
          darwin: chmod 600 ~/.ssh/authorized_keys && chown $(whoami) ~/.ssh/authorized_keys && echo "Permissions set on authorized_keys"
          windows: 'cmd /c icacls "C:\ProgramData\ssh\administrators_authorized_keys" /inheritance:r /grant:r "SYSTEM:(R)" /grant:r "Administrators:(R)"; cmd /c icacls "%USERPROFILE%\.ssh\authorized_keys" /inheritance:r /grant:r "%USERNAME%:(R)"'
        command: chmod 600 ~/.ssh/authorized_keys && chown $(whoami) ~/.ssh/authorized_keys && echo "Permissions set on authorized_keys"
        skip_on_error: true
      - description: Enable public key authentication in sshd_config
        platforms:
          linux: 'sed -i "s/^#PubkeyAuthentication yes/PubkeyAuthentication yes/" /etc/ssh/sshd_config && sed -i "s/^PubkeyAuthentication no/PubkeyAuthentication yes/" /etc/ssh/sshd_config && echo "PubkeyAuthentication enabled"'
          darwin: 'sed -i "" "s/^#PubkeyAuthentication yes/PubkeyAuthentication yes/" /etc/ssh/sshd_config && echo "PubkeyAuthentication enabled"'
          windows: 'cmd /c copy C:\ProgramData\ssh\sshd_config C:\ProgramData\ssh\sshd_config.bak; (Get-Content C:\ProgramData\ssh\sshd_config) -replace "^#PubkeyAuthentication yes","PubkeyAuthentication yes" -replace "^PubkeyAuthentication no","PubkeyAuthentication yes" | Set-Content C:\ProgramData\ssh\sshd_config; Write-Host "PubkeyAuthentication enabled in sshd_config"'
        command: 'sed -i "s/^#PubkeyAuthentication yes/PubkeyAuthentication yes/" /etc/ssh/sshd_config && sed -i "s/^PubkeyAuthentication no/PubkeyAuthentication yes/" /etc/ssh/sshd_config && echo "PubkeyAuthentication enabled"'
        skip_on_error: true
      - description: Restart SSH service to apply changes
        platforms:
          ubuntu: systemctl restart ssh && echo "SSH service restarted"
          debian: systemctl restart ssh && echo "SSH service restarted"
          centos: systemctl restart sshd && echo "SSH service restarted"
          rhel: systemctl restart sshd && echo "SSH service restarted"
          fedora: systemctl restart sshd && echo "SSH service restarted"
          arch: systemctl restart sshd && echo "SSH service restarted"
          darwin: launchctl stop com.openssh.sshd && launchctl start com.openssh.sshd && echo "SSH service restarted"
          windows: 'Restart-Service sshd; Write-Host "SSH service restarted"'
        command: systemctl restart ssh && echo "SSH service restarted"
        skip_on_error: false
      - description: Display connection information
        platforms:
          linux: 'echo "" && echo "========================================" && echo "  SSH Server ready for key-based auth!" && echo "========================================" && echo "" && echo "  From the client machine, connect with:" && echo "    ssh $(whoami)@$(hostname -I 2>/dev/null | cut -d'' '' -f1)" && echo "" && echo "========================================"'
          darwin: 'echo "" && echo "========================================" && echo "  SSH Server ready for key-based auth!" && echo "========================================" && echo "" && echo "  From the client machine, connect with:" && echo "    ssh $(whoami)@$(ipconfig getifaddr en0 2>/dev/null)" && echo "" && echo "========================================"'
          windows: 'Write-Host ""; Write-Host "========================================"; Write-Host "  SSH Server ready for key-based auth!"; Write-Host "========================================"; Write-Host ""; Write-Host "  Hostname: $(hostname)"; ipconfig | Select-String "IPv4 Address"; Write-Host ""; Write-Host "  From the client machine, connect with:"; Write-Host "    ssh $env:USERNAME@<IP_ADDRESS>"; Write-Host ""; Write-Host "  (Use one of the IPv4 addresses shown above)"; Write-Host "========================================"'
        command: 'echo "" && echo "========================================" && echo "  SSH Server ready for key-based auth!" && echo "========================================" && echo "" && echo "  From the client machine, connect with:" && echo "    ssh $(whoami)@$(hostname -I 2>/dev/null | cut -d'' '' -f1)" && echo "" && echo "========================================"'
        skip_on_error: true

  - version: "v2"
    tag: setup
    latest: false
    description: Generate SSH key pair and configure SSH client
    commands:
      - description: Create .ssh directory with correct permissions
        platforms:
          linux: mkdir -p ~/.ssh && chmod 700 ~/.ssh
          darwin: mkdir -p ~/.ssh && chmod 700 ~/.ssh
          windows: 'New-Item -ItemType Directory -Force -Path $env:USERPROFILE\.ssh | Out-Null'
        command: mkdir -p ~/.ssh && chmod 700 ~/.ssh
        skip_on_error: false
      - description: Generate SSH key pair
        platforms:
          linux: ssh-keygen -t {{key_type}} -b {{key_bits}} -C "{{comment}}" -f ~/.ssh/{{key_name}} -N "{{passphrase}}"
          darwin: ssh-keygen -t {{key_type}} -b {{key_bits}} -C "{{comment}}" -f ~/.ssh/{{key_name}} -N "{{passphrase}}"
          windows: 'ssh-keygen -t {{key_type}} -b {{key_bits}} -C "{{comment}}" -f "$env:USERPROFILE\.ssh\{{key_name}}" -N "{{passphrase}}"'
        command: ssh-keygen -t {{key_type}} -b {{key_bits}} -C "{{comment}}" -f ~/.ssh/{{key_name}} -N "{{passphrase}}"
        skip_on_error: false
        args:
          - name: key_type
            prompt: "Enter key type (rsa, ed25519, ecdsa)"
            default: "ed25519"
            required: false
          - name: key_bits
            prompt: "Enter key size in bits (4096 for rsa, ignored for ed25519)"
            default: "4096"
            required: false
          - name: comment
            prompt: "Enter a comment for the key (e.g., your email)"
            default: "shelldock-key"
            required: false
          - name: key_name
            prompt: "Enter key file name (e.g., id_ed25519, id_rsa)"
            default: "id_ed25519"
            required: false
          - name: passphrase
            prompt: "Enter passphrase (leave empty for no passphrase)"
            default: ""
            required: false
      - description: Set correct permissions on key files
        platforms:
          linux: chmod 600 ~/.ssh/{{key_name}} && chmod 644 ~/.ssh/{{key_name}}.pub
          darwin: chmod 600 ~/.ssh/{{key_name}} && chmod 644 ~/.ssh/{{key_name}}.pub
          windows: 'cmd /c icacls "%USERPROFILE%\.ssh\{{key_name}}" /inheritance:r /grant:r "%USERNAME%:(R)"; cmd /c icacls "%USERPROFILE%\.ssh\{{key_name}}.pub" /inheritance:r /grant:r "%USERNAME%:(R)"'
        command: chmod 600 ~/.ssh/{{key_name}} && chmod 644 ~/.ssh/{{key_name}}.pub
        skip_on_error: true
        args:
          - name: key_name
            prompt: "Enter key file name used during generation"
            default: "id_ed25519"
            required: false
      - description: Display key file locations and commands
        platforms:
          linux: 'echo "" && echo "========================================" && echo "  SSH key pair generated successfully!" && echo "========================================" && echo "" && echo "  Private key: ~/.ssh/{{key_name}}" && echo "  Public key:  ~/.ssh/{{key_name}}.pub" && echo "" && echo "  To view your public key run:" && echo "    cat ~/.ssh/{{key_name}}.pub" && echo "" && echo "  To view your private key run:" && echo "    cat ~/.ssh/{{key_name}}" && echo "" && echo "  To add key to SSH agent run:" && echo "    ssh-add ~/.ssh/{{key_name}}" && echo "" && echo "======================================="'
          darwin: 'echo "" && echo "========================================" && echo "  SSH key pair generated successfully!" && echo "========================================" && echo "" && echo "  Private key: ~/.ssh/{{key_name}}" && echo "  Public key:  ~/.ssh/{{key_name}}.pub" && echo "" && echo "  To view your public key run:" && echo "    cat ~/.ssh/{{key_name}}.pub" && echo "" && echo "  To view your private key run:" && echo "    cat ~/.ssh/{{key_name}}" && echo "" && echo "  To add key to SSH agent run:" && echo "    ssh-add --apple-use-keychain ~/.ssh/{{key_name}}" && echo "" && echo "======================================="'
          windows: 'Write-Host ""; Write-Host "========================================"; Write-Host "  SSH key pair generated successfully!"; Write-Host "========================================"; Write-Host ""; Write-Host "  Private key: $env:USERPROFILE\.ssh\{{key_name}}"; Write-Host "  Public key:  $env:USERPROFILE\.ssh\{{key_name}}.pub"; Write-Host ""; Write-Host "  To view your public key, run:"; Write-Host "    type $env:USERPROFILE\.ssh\{{key_name}}.pub"; Write-Host ""; Write-Host "  To view your private key, run:"; Write-Host "    type $env:USERPROFILE\.ssh\{{key_name}}"; Write-Host ""; Write-Host "  To add key to SSH agent, run:"; Write-Host "    ssh-add $env:USERPROFILE\.ssh\{{key_name}}"; Write-Host ""; Write-Host "======================================="'
        command: 'echo "" && echo "========================================" && echo "  SSH key pair generated successfully!" && echo "========================================" && echo "" && echo "  Private key: ~/.ssh/{{key_name}}" && echo "  Public key:  ~/.ssh/{{key_name}}.pub" && echo "" && echo "  To view your public key run:" && echo "    cat ~/.ssh/{{key_name}}.pub" && echo "" && echo "  To view your private key run:" && echo "    cat ~/.ssh/{{key_name}}" && echo "" && echo "  To add key to SSH agent run:" && echo "    ssh-add ~/.ssh/{{key_name}}" && echo "" && echo "======================================="'
        skip_on_error: true
        args:
          - name: key_name
            prompt: "Enter key file name used during generation"
            default: "id_ed25519"
            required: false
