name: openssh
description: OpenSSH server installation and configuration
versions:
  - version: "v1"
    latest: true
    description: OpenSSH server installation and setup
    commands:
      - description: Install OpenSSH server
        platforms:
          ubuntu: apt-get update && apt-get install -y openssh-server
          debian: apt-get update && apt-get install -y openssh-server
          centos: yum install -y openssh-server
          rhel: yum install -y openssh-server
          fedora: dnf install -y openssh-server
          arch: pacman -S --noconfirm openssh
          darwin: echo "OpenSSH is pre-installed on macOS"
        command: apt-get update && apt-get install -y openssh-server
        skip_on_error: false
      - description: Enable and start SSH service
        platforms:
          ubuntu: systemctl enable ssh && systemctl start ssh
          debian: systemctl enable ssh && systemctl start ssh
          centos: systemctl enable sshd && systemctl start sshd
          rhel: systemctl enable sshd && systemctl start sshd
          fedora: systemctl enable sshd && systemctl start sshd
          arch: systemctl enable sshd && systemctl start sshd
          darwin: systemsetup -setremotelogin on
        command: systemctl enable ssh && systemctl start ssh
        skip_on_error: false
      - description: Verify SSH service status
        platforms:
          ubuntu: systemctl status ssh --no-pager
          debian: systemctl status ssh --no-pager
          centos: systemctl status sshd --no-pager
          rhel: systemctl status sshd --no-pager
          fedora: systemctl status sshd --no-pager
          arch: systemctl status sshd --no-pager
          darwin: systemsetup -getremotelogin
        command: systemctl status ssh --no-pager
        skip_on_error: false

