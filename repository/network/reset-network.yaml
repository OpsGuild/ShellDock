name: reset-network
description: Network stack reset, DNS flush, and adapter troubleshooting
versions:
  - version: "v1"
    tag: full
    latest: true
    description: Full network stack reset
    commands:
      - description: Flush DNS cache
        platforms:
          ubuntu: systemd-resolve --flush-caches 2>/dev/null || resolvectl flush-caches 2>/dev/null || systemctl restart systemd-resolved 2>/dev/null; echo "DNS cache flushed"
          debian: systemd-resolve --flush-caches 2>/dev/null || resolvectl flush-caches 2>/dev/null || systemctl restart systemd-resolved 2>/dev/null; echo "DNS cache flushed"
          centos: systemctl restart dnsmasq 2>/dev/null || systemctl restart named 2>/dev/null || nscd -i hosts 2>/dev/null; echo "DNS cache flushed"
          rhel: systemctl restart dnsmasq 2>/dev/null || systemctl restart named 2>/dev/null || nscd -i hosts 2>/dev/null; echo "DNS cache flushed"
          fedora: resolvectl flush-caches 2>/dev/null || systemctl restart systemd-resolved 2>/dev/null; echo "DNS cache flushed"
          arch: resolvectl flush-caches 2>/dev/null || systemctl restart systemd-resolved 2>/dev/null; echo "DNS cache flushed"
          alpine: killall -HUP dnsmasq 2>/dev/null || rc-service dnsmasq restart 2>/dev/null; echo "DNS cache flushed"
          darwin: dscacheutil -flushcache && killall -HUP mDNSResponder && echo "DNS cache flushed"
          windows: 'powershell -Command "Clear-DnsClientCache; Write-Host ''DNS cache flushed''"'
        command: systemd-resolve --flush-caches 2>/dev/null || resolvectl flush-caches 2>/dev/null; echo "DNS cache flushed"
        skip_on_error: true
      - description: Re-enable DHCP on interface
        platforms:
          ubuntu: dhclient {{interface}} && echo "DHCP re-enabled on {{interface}}"
          debian: dhclient {{interface}} && echo "DHCP re-enabled on {{interface}}"
          centos: dhclient {{interface}} && echo "DHCP re-enabled on {{interface}}"
          rhel: dhclient {{interface}} && echo "DHCP re-enabled on {{interface}}"
          fedora: dhclient {{interface}} && echo "DHCP re-enabled on {{interface}}"
          arch: dhclient {{interface}} 2>/dev/null || systemctl restart systemd-networkd; echo "DHCP re-enabled on {{interface}}"
          alpine: udhcpc -i {{interface}} && echo "DHCP re-enabled on {{interface}}"
          darwin: ipconfig set {{interface}} DHCP && echo "DHCP re-enabled on {{interface}}"
          windows: 'netsh interface ip set address "{{interface}}" dhcp; Write-Host "DHCP re-enabled on {{interface}}"'
        command: dhclient {{interface}} && echo "DHCP re-enabled on {{interface}}"
        skip_on_error: true
        args:
          - name: interface
            prompt: "Enter the network interface name (e.g., eth0, ens33, Ethernet, en0)"
            default: "eth0"
            required: true
      - description: Release and renew IP address
        platforms:
          ubuntu: dhclient -r {{interface}} && sleep 2 && dhclient {{interface}} && echo "IP address renewed"
          debian: dhclient -r {{interface}} && sleep 2 && dhclient {{interface}} && echo "IP address renewed"
          centos: dhclient -r {{interface}} && sleep 2 && dhclient {{interface}} && echo "IP address renewed"
          rhel: dhclient -r {{interface}} && sleep 2 && dhclient {{interface}} && echo "IP address renewed"
          fedora: dhclient -r {{interface}} && sleep 2 && dhclient {{interface}} && echo "IP address renewed"
          arch: dhclient -r {{interface}} 2>/dev/null && sleep 2 && dhclient {{interface}} 2>/dev/null || (systemctl restart systemd-networkd && echo "Network service restarted")
          alpine: udhcpc -R -i {{interface}} && echo "IP address renewed"
          darwin: ipconfig set {{interface}} DHCP && echo "IP address renewed"
          windows: 'ipconfig /release "{{interface}}"; Start-Sleep -Seconds 2; ipconfig /renew "{{interface}}"; Write-Host "IP address renewed on {{interface}}"'
        command: dhclient -r {{interface}} && sleep 2 && dhclient {{interface}} && echo "IP address renewed"
        skip_on_error: true
        args:
          - name: interface
            prompt: "Enter the network interface name (e.g., eth0, ens33, Ethernet, en0)"
            default: "eth0"
            required: true
      - description: Restart network service
        platforms:
          ubuntu: systemctl restart NetworkManager 2>/dev/null || systemctl restart networking 2>/dev/null || systemctl restart systemd-networkd 2>/dev/null; echo "Network service restarted"
          debian: systemctl restart NetworkManager 2>/dev/null || systemctl restart networking 2>/dev/null || systemctl restart systemd-networkd 2>/dev/null; echo "Network service restarted"
          centos: systemctl restart NetworkManager 2>/dev/null || systemctl restart network 2>/dev/null; echo "Network service restarted"
          rhel: systemctl restart NetworkManager 2>/dev/null || systemctl restart network 2>/dev/null; echo "Network service restarted"
          fedora: systemctl restart NetworkManager 2>/dev/null || systemctl restart systemd-networkd 2>/dev/null; echo "Network service restarted"
          arch: systemctl restart NetworkManager 2>/dev/null || systemctl restart systemd-networkd 2>/dev/null; echo "Network service restarted"
          alpine: rc-service networking restart 2>/dev/null; echo "Network service restarted"
          darwin: networksetup -setnetworkserviceenabled Wi-Fi off && sleep 2 && networksetup -setnetworkserviceenabled Wi-Fi on; echo "Network service restarted"
          windows: 'powershell -Command "Restart-Service -Name ''Dhcp'' -Force -ErrorAction SilentlyContinue; Write-Host ''DHCP service restarted''"'
        command: systemctl restart NetworkManager 2>/dev/null || systemctl restart networking 2>/dev/null || systemctl restart systemd-networkd 2>/dev/null; echo "Network service restarted"
        skip_on_error: true
      - description: Reset network stack (deep reset)
        platforms:
          ubuntu: ip link set {{interface}} down && sleep 2 && ip link set {{interface}} up && echo "Network stack reset"
          debian: ip link set {{interface}} down && sleep 2 && ip link set {{interface}} up && echo "Network stack reset"
          centos: ip link set {{interface}} down && sleep 2 && ip link set {{interface}} up && echo "Network stack reset"
          rhel: ip link set {{interface}} down && sleep 2 && ip link set {{interface}} up && echo "Network stack reset"
          fedora: ip link set {{interface}} down && sleep 2 && ip link set {{interface}} up && echo "Network stack reset"
          arch: ip link set {{interface}} down && sleep 2 && ip link set {{interface}} up && echo "Network stack reset"
          alpine: ip link set {{interface}} down && sleep 2 && ip link set {{interface}} up && echo "Network stack reset"
          darwin: ifconfig {{interface}} down && sleep 2 && ifconfig {{interface}} up && echo "Network stack reset"
          windows: 'powershell -Command "Disable-NetAdapter -Name ''{{interface}}'' -Confirm:([bool]0); Start-Sleep -Seconds 2; Enable-NetAdapter -Name ''{{interface}}''; Start-Sleep -Seconds 3; Write-Host ''Adapter {{interface}} reset complete''"'
        command: ip link set {{interface}} down && sleep 2 && ip link set {{interface}} up && echo "Network stack reset"
        skip_on_error: true
        args:
          - name: interface
            prompt: "Enter the network interface name (e.g., eth0, ens33, Ethernet, en0)"
            default: "eth0"
            required: true
      - description: Verify network connectivity
        platforms:
          ubuntu: echo "=== Interface Status ===" && ip -br addr show {{interface}} && echo "" && echo "=== DNS Test ===" && nslookup google.com 2>/dev/null | head -4 && echo "" && echo "=== Connectivity ===" && ping -c 2 -W 3 8.8.8.8 && echo "Network OK"
          debian: echo "=== Interface Status ===" && ip -br addr show {{interface}} && echo "" && echo "=== DNS Test ===" && nslookup google.com 2>/dev/null | head -4 && echo "" && echo "=== Connectivity ===" && ping -c 2 -W 3 8.8.8.8 && echo "Network OK"
          centos: echo "=== Interface Status ===" && ip -br addr show {{interface}} && echo "" && echo "=== DNS Test ===" && nslookup google.com 2>/dev/null | head -4 && echo "" && echo "=== Connectivity ===" && ping -c 2 -W 3 8.8.8.8 && echo "Network OK"
          rhel: echo "=== Interface Status ===" && ip -br addr show {{interface}} && echo "" && echo "=== DNS Test ===" && nslookup google.com 2>/dev/null | head -4 && echo "" && echo "=== Connectivity ===" && ping -c 2 -W 3 8.8.8.8 && echo "Network OK"
          fedora: echo "=== Interface Status ===" && ip -br addr show {{interface}} && echo "" && echo "=== DNS Test ===" && nslookup google.com 2>/dev/null | head -4 && echo "" && echo "=== Connectivity ===" && ping -c 2 -W 3 8.8.8.8 && echo "Network OK"
          arch: echo "=== Interface Status ===" && ip -br addr show {{interface}} && echo "" && echo "=== DNS Test ===" && nslookup google.com 2>/dev/null | head -4 && echo "" && echo "=== Connectivity ===" && ping -c 2 -W 3 8.8.8.8 && echo "Network OK"
          alpine: echo "=== Interface Status ===" && ip -br addr show {{interface}} && echo "" && echo "=== Connectivity ===" && ping -c 2 -W 3 8.8.8.8 && echo "Network OK"
          darwin: echo "=== Interface Status ===" && ifconfig {{interface}} | head -5 && echo "" && echo "=== DNS Test ===" && nslookup google.com 2>/dev/null | head -4 && echo "" && echo "=== Connectivity ===" && ping -c 2 -W 3 8.8.8.8 && echo "Network OK"
          windows: 'Write-Host "=== Interface Status ==="; Get-NetAdapter "{{interface}}" | Format-List Name, Status, LinkSpeed; Write-Host "=== IP Configuration ==="; Get-NetIPAddress -InterfaceAlias "{{interface}}" -AddressFamily IPv4 -ErrorAction SilentlyContinue | Format-List IPAddress, PrefixLength; Write-Host "=== DNS Test ==="; cmd /c nslookup google.com 2>nul; Write-Host ""; Write-Host "=== Connectivity ==="; cmd /c ping -n 2 -w 3000 8.8.8.8'
        command: echo "=== Interface Status ===" && ip -br addr show {{interface}} && echo "" && echo "=== DNS Test ===" && nslookup google.com 2>/dev/null | head -4 && echo "" && echo "=== Connectivity ===" && ping -c 2 -W 3 8.8.8.8 && echo "Network OK"
        skip_on_error: true
        args:
          - name: interface
            prompt: "Enter the network interface name (e.g., eth0, ens33, Ethernet, en0)"
            default: "eth0"
            required: true

  - version: "v2"
    tag: dns
    latest: false
    description: DNS cache flush and verify
    commands:
      - description: Flush DNS cache
        platforms:
          ubuntu: systemd-resolve --flush-caches 2>/dev/null || resolvectl flush-caches 2>/dev/null || systemctl restart systemd-resolved 2>/dev/null; echo "DNS cache flushed"
          debian: systemd-resolve --flush-caches 2>/dev/null || resolvectl flush-caches 2>/dev/null || systemctl restart systemd-resolved 2>/dev/null; echo "DNS cache flushed"
          centos: systemctl restart dnsmasq 2>/dev/null || systemctl restart named 2>/dev/null || nscd -i hosts 2>/dev/null; echo "DNS cache flushed"
          rhel: systemctl restart dnsmasq 2>/dev/null || systemctl restart named 2>/dev/null || nscd -i hosts 2>/dev/null; echo "DNS cache flushed"
          fedora: resolvectl flush-caches 2>/dev/null || systemctl restart systemd-resolved 2>/dev/null; echo "DNS cache flushed"
          arch: resolvectl flush-caches 2>/dev/null || systemctl restart systemd-resolved 2>/dev/null; echo "DNS cache flushed"
          alpine: killall -HUP dnsmasq 2>/dev/null || rc-service dnsmasq restart 2>/dev/null; echo "DNS cache flushed"
          darwin: dscacheutil -flushcache && killall -HUP mDNSResponder && echo "DNS cache flushed"
          windows: 'powershell -Command "Clear-DnsClientCache; Write-Host ''DNS cache flushed''"'
        command: systemd-resolve --flush-caches 2>/dev/null || resolvectl flush-caches 2>/dev/null; echo "DNS cache flushed"
        skip_on_error: true
      - description: Verify DNS resolution
        platforms:
          ubuntu: nslookup google.com && echo "DNS resolution OK"
          debian: nslookup google.com && echo "DNS resolution OK"
          centos: nslookup google.com && echo "DNS resolution OK"
          rhel: nslookup google.com && echo "DNS resolution OK"
          fedora: nslookup google.com && echo "DNS resolution OK"
          arch: nslookup google.com && echo "DNS resolution OK"
          alpine: nslookup google.com && echo "DNS resolution OK"
          darwin: nslookup google.com && echo "DNS resolution OK"
          windows: 'powershell -Command "Resolve-DnsName google.com -ErrorAction SilentlyContinue | Select-Object Name, IPAddress | Format-Table -AutoSize; Write-Host ''DNS resolution OK''"'
        command: nslookup google.com && echo "DNS resolution OK"
        skip_on_error: false

  - version: "v3"
    tag: adapter
    latest: false
    description: Restart or hard-reset a network adapter
    commands:
      - description: List all network adapters
        platforms:
          ubuntu: ip -br link show
          debian: ip -br link show
          centos: ip -br link show
          rhel: ip -br link show
          fedora: ip -br link show
          arch: ip -br link show
          alpine: ip -br link show
          darwin: networksetup -listallhardwareports
          windows: 'powershell -Command "Get-NetAdapter | Select-Object Name, InterfaceDescription, Status, LinkSpeed, MacAddress | Format-Table -AutoSize"'
        command: ip -br link show
        skip_on_error: true
      - description: Restart network adapter
        platforms:
          ubuntu: ip link set {{adapter}} down && sleep 2 && ip link set {{adapter}} up && echo "Adapter {{adapter}} restarted"
          debian: ip link set {{adapter}} down && sleep 2 && ip link set {{adapter}} up && echo "Adapter {{adapter}} restarted"
          centos: ip link set {{adapter}} down && sleep 2 && ip link set {{adapter}} up && echo "Adapter {{adapter}} restarted"
          rhel: ip link set {{adapter}} down && sleep 2 && ip link set {{adapter}} up && echo "Adapter {{adapter}} restarted"
          fedora: ip link set {{adapter}} down && sleep 2 && ip link set {{adapter}} up && echo "Adapter {{adapter}} restarted"
          arch: ip link set {{adapter}} down && sleep 2 && ip link set {{adapter}} up && echo "Adapter {{adapter}} restarted"
          alpine: ip link set {{adapter}} down && sleep 2 && ip link set {{adapter}} up && echo "Adapter {{adapter}} restarted"
          darwin: ifconfig {{adapter}} down && sleep 2 && ifconfig {{adapter}} up && echo "Adapter {{adapter}} restarted"
          windows: 'powershell -Command "Get-NetAdapter ''{{adapter}}'' | Restart-NetAdapter; Start-Sleep -Seconds 3; Get-NetAdapter ''{{adapter}}'' | Select-Object Name, Status, LinkSpeed"'
        command: ip link set {{adapter}} down && sleep 2 && ip link set {{adapter}} up && echo "Adapter {{adapter}} restarted"
        skip_on_error: false
        args:
          - name: adapter
            prompt: "Enter the network adapter name (e.g., eth0, ens33, en0, Ethernet, Wi-Fi)"
            required: true
      - description: Verify adapter status
        platforms:
          ubuntu: ip addr show {{adapter}}
          debian: ip addr show {{adapter}}
          centos: ip addr show {{adapter}}
          rhel: ip addr show {{adapter}}
          fedora: ip addr show {{adapter}}
          arch: ip addr show {{adapter}}
          alpine: ip addr show {{adapter}}
          darwin: ifconfig {{adapter}}
          windows: 'powershell -Command "Get-NetAdapter ''{{adapter}}'' | Select-Object Name, Status, LinkSpeed; Get-NetIPAddress -InterfaceAlias ''{{adapter}}'' -ErrorAction SilentlyContinue | Select-Object IPAddress, PrefixLength, AddressFamily | Format-Table -AutoSize"'
        command: ip addr show {{adapter}}
        skip_on_error: false
        args:
          - name: adapter
            prompt: "Enter the network adapter name to verify (e.g., eth0, ens33, en0, Ethernet, Wi-Fi)"
            required: true
