name: docker
description: Docker installation and setup commands
versions:
  - version: "v1"
    latest: true
    description: Docker installation with platform-specific commands
    commands:
      - description: Update package index
        platforms:
          ubuntu: apt-get update
          debian: apt-get update
          centos: yum check-update || true
          rhel: yum check-update || true
          fedora: dnf check-update || true
          arch: pacman -Sy
          darwin: brew update
          windows: powershell -Command "winget source update"
        command: apt-get update
        skip_on_error: true
      - description: Install Docker
        platforms:
          ubuntu: curl -fsSL https://get.docker.com -o get-docker.sh && sh get-docker.sh
          debian: curl -fsSL https://get.docker.com -o get-docker.sh && sh get-docker.sh
          centos: yum install -y docker
          rhel: yum install -y docker
          fedora: dnf install -y docker
          arch: pacman -S docker
          darwin: brew install --cask docker
          windows: powershell -Command "winget install -e --id Docker.DockerDesktop --accept-source-agreements --accept-package-agreements"
        command: curl -fsSL https://get.docker.com -o get-docker.sh && sh get-docker.sh
      - description: Start Docker service
        platforms:
          linux: systemctl start docker
          darwin: open -a Docker
          windows: powershell -Command "Start-Process 'C:\Program Files\Docker\Docker\Docker Desktop.exe'"
        command: systemctl start docker
        skip_on_error: true
      - description: Enable Docker on boot
        platforms:
          linux: systemctl enable docker
          windows: powershell -Command "Set-ItemProperty -Path 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Run' -Name 'DockerDesktop' -Value '\"C:\Program Files\Docker\Docker\Docker Desktop.exe\"'"
        command: systemctl enable docker
        skip_on_error: true
      - description: Add current user to docker group (Linux only)
        platforms:
          linux: usermod -aG docker $USER
          windows: powershell -Command "Add-LocalGroupMember -Group 'docker-users' -Member $env:USERNAME -ErrorAction SilentlyContinue"
        command: usermod -aG docker $USER
        skip_on_error: true
      - description: Verify Docker installation
        command: docker --version
        skip_on_error: false
