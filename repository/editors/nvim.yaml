name: nvim
description: Neovim nightly installation (latest build from GitHub)
versions:
  - version: "v1"
    latest: true
    description: Neovim nightly installation from GitHub releases
    commands:
      - description: Install Neovim nightly
        platforms:
          ubuntu: 'curl -LO https://github.com/neovim/neovim/releases/download/nightly/nvim-linux-x86_64.tar.gz && rm -rf /opt/nvim && tar -C /opt -xzf nvim-linux-x86_64.tar.gz && mv /opt/nvim-linux-x86_64 /opt/nvim && rm nvim-linux-x86_64.tar.gz && ln -sf /opt/nvim/bin/nvim /usr/local/bin/nvim'
          debian: 'curl -LO https://github.com/neovim/neovim/releases/download/nightly/nvim-linux-x86_64.tar.gz && rm -rf /opt/nvim && tar -C /opt -xzf nvim-linux-x86_64.tar.gz && mv /opt/nvim-linux-x86_64 /opt/nvim && rm nvim-linux-x86_64.tar.gz && ln -sf /opt/nvim/bin/nvim /usr/local/bin/nvim'
          centos: 'curl -LO https://github.com/neovim/neovim/releases/download/nightly/nvim-linux-x86_64.tar.gz && rm -rf /opt/nvim && tar -C /opt -xzf nvim-linux-x86_64.tar.gz && mv /opt/nvim-linux-x86_64 /opt/nvim && rm nvim-linux-x86_64.tar.gz && ln -sf /opt/nvim/bin/nvim /usr/local/bin/nvim'
          rhel: 'curl -LO https://github.com/neovim/neovim/releases/download/nightly/nvim-linux-x86_64.tar.gz && rm -rf /opt/nvim && tar -C /opt -xzf nvim-linux-x86_64.tar.gz && mv /opt/nvim-linux-x86_64 /opt/nvim && rm nvim-linux-x86_64.tar.gz && ln -sf /opt/nvim/bin/nvim /usr/local/bin/nvim'
          fedora: 'curl -LO https://github.com/neovim/neovim/releases/download/nightly/nvim-linux-x86_64.tar.gz && rm -rf /opt/nvim && tar -C /opt -xzf nvim-linux-x86_64.tar.gz && mv /opt/nvim-linux-x86_64 /opt/nvim && rm nvim-linux-x86_64.tar.gz && ln -sf /opt/nvim/bin/nvim /usr/local/bin/nvim'
          arch: 'curl -LO https://github.com/neovim/neovim/releases/download/nightly/nvim-linux-x86_64.tar.gz && rm -rf /opt/nvim && tar -C /opt -xzf nvim-linux-x86_64.tar.gz && mv /opt/nvim-linux-x86_64 /opt/nvim && rm nvim-linux-x86_64.tar.gz && ln -sf /opt/nvim/bin/nvim /usr/local/bin/nvim'
          darwin: 'curl -LO https://github.com/neovim/neovim/releases/download/nightly/nvim-macos-arm64.tar.gz && rm -rf /opt/nvim && mkdir -p /opt && tar -C /opt -xzf nvim-macos-arm64.tar.gz && mv /opt/nvim-macos-arm64 /opt/nvim && rm nvim-macos-arm64.tar.gz && ln -sf /opt/nvim/bin/nvim /usr/local/bin/nvim'
          windows: 'winget install -e --id Neovim.Neovim.Nightly --accept-source-agreements --accept-package-agreements'
        command: 'curl -LO https://github.com/neovim/neovim/releases/download/nightly/nvim-linux-x86_64.tar.gz && rm -rf /opt/nvim && tar -C /opt -xzf nvim-linux-x86_64.tar.gz && mv /opt/nvim-linux-x86_64 /opt/nvim && rm nvim-linux-x86_64.tar.gz && ln -sf /opt/nvim/bin/nvim /usr/local/bin/nvim'
        skip_on_error: false
      - description: Verify Neovim installation
        platforms:
          linux: /usr/local/bin/nvim --version | head -3
          darwin: /usr/local/bin/nvim --version | head -3
          windows: 'nvim --version | Select-Object -First 3'
        command: /usr/local/bin/nvim --version | head -3
        skip_on_error: false
      - description: Create Neovim config directory
        platforms:
          linux: mkdir -p ~/.config/nvim
          darwin: mkdir -p ~/.config/nvim
          windows: 'New-Item -ItemType Directory -Force -Path $env:LOCALAPPDATA\nvim'
        command: mkdir -p ~/.config/nvim
        skip_on_error: true
