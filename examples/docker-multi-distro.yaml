name: docker
description: Docker installation and setup commands (multi-distribution)
version: "1.0.0"
commands:
  - description: Update package index
    platforms:
      ubuntu: apt-get update
      debian: apt-get update
      centos: yum check-update || true
      rhel: yum check-update || true
      fedora: dnf check-update || true
      arch: pacman -Sy
      darwin: brew update
      windows: choco upgrade chocolatey
    skip_on_error: false
  - description: Install Docker
    platforms:
      ubuntu: curl -fsSL https://get.docker.com -o get-docker.sh && sh get-docker.sh
      debian: curl -fsSL https://get.docker.com -o get-docker.sh && sh get-docker.sh
      centos: yum install -y docker
      rhel: yum install -y docker
      fedora: dnf install -y docker
      arch: pacman -S docker
      darwin: brew install --cask docker
      windows: choco install docker-desktop
    skip_on_error: false
  - description: Start Docker service
    platforms:
      ubuntu: systemctl start docker
      debian: systemctl start docker
      centos: systemctl start docker
      rhel: systemctl start docker
      fedora: systemctl start docker
      arch: systemctl start docker
      darwin: open -a Docker
      windows: Start-Service docker
    skip_on_error: true
  - description: Enable Docker on boot
    platforms:
      ubuntu: systemctl enable docker
      debian: systemctl enable docker
      centos: systemctl enable docker
      rhel: systemctl enable docker
      fedora: systemctl enable docker
      arch: systemctl enable docker
      darwin: echo "Docker auto-starts on macOS"
      windows: Set-Service -Name docker -StartupType Automatic
    skip_on_error: true
